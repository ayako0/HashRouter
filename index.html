<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Hash Router</title>
    <style>
        nav a { margin-right: 15px; text-decoration: none; color: blue; }
        nav a:hover { text-decoration: underline; }
        .page { display: none; margin-top: 20px; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <nav>
        <a href="#/">Home</a>
        <a href="#/about">About</a>
        <a href="#/contact">Contact</a>
    </nav>

    <!-- Page Content Containers -->
    <div id="home" class="page">
        <h1>Home Page</h1>
        <p>Welcome to the home page!</p>
    </div>
    <div id="about" class="page">
        <h1>About Page</h1>
        <p>This is the about page.</p>
    </div>
    <div id="contact" class="page">
        <h1>Contact Page</h1>
        <p>Get in touch with us here.</p>
    </div>

    <script>
        function router() {
            // Get the hash part of the URL (default to '#/' if empty)
            const hash = window.location.hash || '#/';
            
            // Hide all pages
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });

            // Match hash to corresponding element id
            let targetId = 'home';
            if (hash === '#/about') {
                targetId = 'about';
            } else if (hash === '#/contact') {
                targetId = 'contact';
            }

            // Show target page
            const targetPage = document.getElementById(targetId);
            if (targetPage) {
                targetPage.classList.add('active');
            }
        }

        // Listen for changes to the hash
        window.addEventListener('hashchange', router);

        // Run router on initial page load / refresh
        window.addEventListener('DOMContentLoaded', router);
    </script>
</body>
</html>
